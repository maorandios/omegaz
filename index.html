<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Create folded metal profile fabrication requests — fast, guided, export PDF + Excel" />
    <title>OMEGAZ</title>
  </head>
  <body>
    <div id="root">
      <div
        id="boot-fallback"
        style="
          display: flex;
          min-height: 100dvh;
          align-items: center;
          justify-content: center;
          background: #09090b;
          color: #a1a1aa;
          font-family: system-ui, sans-serif;
          font-size: 0.875rem;
        "
      >
        Loading OMEGAZ…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      setTimeout(function () {
        if (document.documentElement.dataset.appReady) return
        var el = document.getElementById('boot-fallback')
        if (!el) return
        el.innerHTML =
          '<div style="text-align:center;padding:1.5rem;max-width:20rem">' +
          '<p style="color:#fbbf24;font-weight:600;margin-bottom:0.5rem">Still loading?</p>' +
          '<p style="margin-bottom:1rem;font-size:0.8rem">Try closing all tabs, then reopen. Or open in Safari/Chrome (not the home-screen icon) once.</p>' +
          '<button type="button" style="background:#f59e0b;color:#09090b;border:none;border-radius:0.5rem;padding:0.5rem 1rem;font-size:0.875rem" ' +
          'onclick="(async function(){try{localStorage.clear();sessionStorage.clear();if(navigator.serviceWorker){var r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(function(x){return x.unregister()}))}if(window.caches){var k=await caches.keys();await Promise.all(k.map(function(c){return caches.delete(c)}))}}catch(e){}location.reload()})()">Reset &amp; reload</button>' +
          '</div>'
      }, 12000)
    </script>
  </body>
</html>
